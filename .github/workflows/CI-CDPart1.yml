name: CI/CD Part 1 - Validate Documentation

on: [push, pull_request]

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check docs folder
        run: |
          if [ -d "docs" ]; then
            echo "✅ docs folder exists"
          else
            echo "❌ docs folder missing"
            exit 1
          fi
      
      - name: Check ERD file
        run: |
          if [ -f "docs/ERD.png" ] || [ -f "docs/ERD.pdf" ]; then
            echo "✅ ERD file exists"
          else
            echo "❌ ERD file missing (expected ERD.png or ERD.pdf)"
            exit 1
          fi
      
      - name: Check API Endpoint Plan (flexible)
        run: |
          # Check for API plan with various naming conventions
          if [ -f "docs/API-Endpoint-Plan.md" ] || [ -f "docs/API-Endpoint-Plan.pdf" ] || \
             [ -f "docs/API-Plan.md" ] || [ -f "docs/API-Plan.pdf" ] || \
             [ -f "docs/API_Endpoint_Plan.md" ] || [ -f "docs/API_Endpoint_Plan.pdf" ] || \
             ls docs/*.md | grep -i "api" > /dev/null 2>&1 || ls docs/*.pdf | grep -i "api" > /dev/null 2>&1; then
            echo "✅ API Endpoint Plan exists"
          else
            echo "❌ API Endpoint Plan missing (expected API-Endpoint-Plan.md or API-Endpoint-Plan.pdf)"
            exit 1
          fi
      
      - name: Check SQL Script
        run: |
          if [ -f "docs/RaceDay-Database.sql" ]; then
            echo "✅ SQL Script exists"
          else
            echo "❌ SQL Script missing (expected RaceDay-Database.sql)"
            exit 1
          fi
      
      - name: Check README
        run: |
          if [ -f "README.md" ]; then
            echo "✅ README.md exists"
          else
            echo "❌ README.md missing"
            exit 1
          fi
      
      - name: List docs folder contents
        run: |
          echo ""
          echo "📂 Contents of /docs:"
          ls -la docs/
          echo ""
      
      - name: Final success message
        run: |
          echo "========================================="
          echo "🎉 ALL VALIDATIONS PASSED SUCCESSFULLY!"
          echo "========================================="
