name: Validate Documentation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Check for /docs folder
      run: |
        if [ -d "docs" ]; then
          echo "✅ /docs folder exists."
        else
          echo "❌ /docs folder not found!"
          exit 1
        fi
    
    - name: Check for ERD file (PNG or PDF)
      run: |
        if ls docs/ERD.* 1> /dev/null 2>&1; then
          echo "✅ ERD file exists."
        else
          echo "❌ ERD file not found in /docs! Please add ERD.png or ERD.pdf"
          exit 1
        fi
    
    - name: Check for API Endpoint Plan (MD or PDF)
      run: |
        if ls docs/API-Endpoint-Plan.* 1> /dev/null 2>&1; then
          echo "✅ API Endpoint Plan exists."
        else
          echo "❌ API Endpoint Plan not found in /docs! Please add API-Endpoint-Plan.md or API-Endpoint-Plan.pdf"
          exit 1
        fi
    
    - name: Check for SQL Script
      run: |
        if [ -f "docs/RaceDay-Database.sql" ]; then
          echo "✅ SQL Script exists."
        else
          echo "❌ SQL Script not found in /docs! Please add RaceDay-Database.sql"
          exit 1
        fi
    
    - name: Check for README.md
      run: |
        if [ -f "README.md" ]; then
          echo "✅ README.md exists."
        else
          echo "❌ README.md not found in root directory!"
          exit 1
        fi
    
    - name: Validate file extensions
      run: |
        echo "========================================="
        echo "📁 Validating file extensions in /docs:"
        echo "========================================="
        
        # Check ERD file extension
        if ls docs/ERD.* 1> /dev/null 2>&1; then
          for file in docs/ERD.*; do
            extension="${file##*.}"
            if [[ "$extension" == "png" ]] || [[ "$extension" == "pdf" ]]; then
              echo "✅ ERD.$extension - Valid extension"
            else
              echo "❌ ERD.$extension - Invalid extension! Use .png or .pdf"
              exit 1
            fi
          done
        fi
        
        # Check API Endpoint Plan file extension
        if ls docs/API-Endpoint-Plan.* 1> /dev/null 2>&1; then
          for file in docs/API-Endpoint-Plan.*; do
            extension="${file##*.}"
            if [[ "$extension" == "md" ]] || [[ "$extension" == "pdf" ]]; then
              echo "✅ API-Endpoint-Plan.$extension - Valid extension"
            else
              echo "❌ API-Endpoint-Plan.$extension - Invalid extension! Use .md or .pdf"
              exit 1
            fi
          done
        fi
        
        echo "========================================="
        echo "✅ All file validations passed!"
        echo "========================================="
    
    - name: List all files in docs folder
      run: |
        echo "========================================="
        echo "📂 Contents of /docs folder:"
        echo "========================================="
        ls -la docs/
    
    - name: Success message
      run: |
        echo "========================================="
        echo "🎉 ALL VALIDATIONS PASSED SUCCESSFULLY!"
        echo "========================================="
        echo "✅ /docs folder exists"
        echo "✅ ERD file found (PNG or PDF)"
        echo "✅ API Endpoint Plan found (MD or PDF)"
        echo "✅ SQL Script found"
        echo "✅ README.md found"
        echo "✅ All file extensions are valid"
        echo "========================================="
